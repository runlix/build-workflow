name: Publish CI Tool Image

on:
  push:
    branches:
      - main
  workflow_call:
    outputs:
      digest:
        description: Digest of the published immutable tool image.
        value: ${{ jobs.publish-immutable.outputs.digest }}
      tool_image:
        description: Immutable GHCR tag for the current commit tool image.
        value: ${{ jobs.publish-immutable.outputs.tool_image }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-immutable:
    name: publish-immutable
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tool_image: ${{ steps.meta.outputs.tool_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Resolve immutable tool image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          printf 'tool_image=ghcr.io/runlix/build-workflow-tools:sha-%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable tool image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tools/ci/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tool_image }}

      - name: Summarize immutable tool image refs
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## Published CI Tool Image"
            echo ""
            echo "- Git SHA tag: \`${{ steps.meta.outputs.tool_image }}\`"
            echo "- Digest ref: \`ghcr.io/runlix/build-workflow-tools@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
